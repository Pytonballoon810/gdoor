# GDoor DIN board with two-way voice: Ethernet, doorbell, door opener, and
# calls to Home Assistant through VoIP Stack. See din/voice.yaml for the
# values to fill in before the first call. Needs ESPHome 2026.9.0 or newer.

packages:
  din: !include din/common.yaml
  voice: !include din/voice.yaml

ethernet:
  type: W5500
  cs_pin: GPIO10
  mosi_pin: GPIO11
  clk_pin: GPIO12
  miso_pin: GPIO13
  interrupt_pin: GPIO14
  reset_pin: GPIO21
