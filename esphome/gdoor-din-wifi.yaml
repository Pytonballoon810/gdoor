# GDoor DIN board on WiFi (no Ethernet cable).
# ESPHome runs either Ethernet or WiFi, so Ethernet is in gdoor-din-ethernet.yaml.

packages:
  din: !include din/common.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}  # fallback hotspot if the network is not reachable

captive_portal:
