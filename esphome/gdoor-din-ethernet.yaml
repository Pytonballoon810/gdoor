# GDoor DIN board on wired Ethernet (W5500 on SPI2).
# ESPHome runs either Ethernet or WiFi, so WiFi is in gdoor-din-wifi.yaml.

packages:
  din: !include din/common.yaml

ethernet:
  type: W5500
  cs_pin: GPIO10
  mosi_pin: GPIO11
  clk_pin: GPIO12
  miso_pin: GPIO13
  interrupt_pin: GPIO14
  reset_pin: GPIO21
