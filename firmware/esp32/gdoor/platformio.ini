; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[env:GDOOR_ESP32MINI]
; Jason2866's Arduino/IDF5 branch was removed upstream; pioarduino is its maintained successor.
; Pinned so a new Arduino core release cannot silently change the timer/LEDC behaviour.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino
; 2x 1.875 MB app slots (OTA) + 128 kB LittleFS for the config files, instead of the
; default 2x 1.25 MB + 1.375 MB. Ethernet and the web console no longer fit the default.
; Changing the partition table needs one flash over USB (see README, "Migrating to the larger partition layout").
board_build.partitions = min_spiffs.csv
build_flags = -Wall
check_src_filters = 
	+<src/*>
	+<*.ino>
monitor_speed = 115200
lib_deps =
	https://github.com/tzapu/WiFiManager.git
	256dpi/MQTT@^2.5.2
extra_scripts =
    prepare-web-installer.py