name: DIN board release

# Builds the DIN board's ESPHome firmware, collects its production and 3D
# files, and attaches them to a draft release. Push a tag such as din-1.0.
# Run it by hand (workflow_dispatch) to get the same files as a workflow
# artifact, without a release.

on:
  push:
    tags:
      - 'din-*'
  workflow_dispatch:

jobs:
  firmware:
    if: github.repository == 'Pytonballoon810/gdoor'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # The voice config is not built: din/voice.yaml needs per-install values.
        network: [ethernet, wifi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-esphome-gdoor-din-${{ matrix.network }}.yaml

      - name: Check the component's copy of the bus core is up to date
        run: python tools/sync_esphome_core.py --check

      - name: Install ESPHome
        run: pip install esphome

      # The WiFi image cannot know the user's network: it fails to join these
      # placeholder credentials and opens its fallback hotspot with the captive portal.
      - name: Compile gdoor-din-${{ matrix.network }}.yaml
        working-directory: ./esphome
        run: |
          printf 'wifi_ssid: "gdoor-setup"\nwifi_password: "gdoor-setup"\n' > secrets.yaml
          esphome compile gdoor-din-${{ matrix.network }}.yaml

      - name: Collect images
        run: |
          mkdir out
          factory=$(find esphome/.esphome/build -name firmware.factory.bin | head -n1)
          ota=$(find esphome/.esphome/build -name firmware.ota.bin | head -n1)
          test -n "$factory" && test -n "$ota"
          cp "$factory" out/firmware-${{ matrix.network }}.factory.bin
          cp "$ota" out/firmware-${{ matrix.network }}.ota.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.network }}
          path: out/*.bin

  release:
    if: github.repository == 'Pytonballoon810/gdoor'
    runs-on: ubuntu-latest
    needs: firmware
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/din-* ]]; then
            VERSION=${GITHUB_REF#refs/tags/din-}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: fw

      - name: Collect release files
        run: |
          D=hardware/boards/din
          P=$D/production/gdoor_din
          E=$D/enclosure
          N=gdoor-din-${VERSION}
          mkdir release
          # JLCPCB order: upload gerbers, BOM and positions as they are.
          # Recommended: JLC leaves the hand-soldered parts off; full PCBA: JLC places them too.
          cp $P/gdoor_din_gerbers.zip release/$N-gerbers.zip
          cp $P/bom.csv               release/$N-recommended-bom.csv
          cp $P/positions.csv         release/$N-recommended-positions.csv
          cp $P/hand_soldered.csv     release/$N-hand-soldered.csv
          cp $P/bom-full.csv          release/$N-full-pcba-bom.csv
          cp $P/positions-full.csv    release/$N-full-pcba-positions.csv
          cp $P/designators.csv       release/$N-designators.csv
          cp $P/netlist.ipc           release/$N-netlist.ipc
          cp $P/ibom.html             release/$N-ibom.html
          # 3D: the board STEP is ~60 MB, zipped it is ~10 MB
          (cd $D && zip -9 -q ../../../release/$N-board-step.zip PowerModule.step)
          (cd $E && zip -9 -q ../../../../release/$N-enclosure-step.zip \
            gdoor-din-enclosure.step gdoor-din-base.step gdoor-din-lid.step gdoor-din-keeper.step)
          cp $E/gdoor-din-base.stl   release/$N-enclosure-base.stl
          cp $E/gdoor-din-lid.stl    release/$N-enclosure-lid.stl
          cp $E/gdoor-din-keeper.stl release/$N-enclosure-keeper.stl
          # Bambu Studio project, unsliced: plate 1 single colour, plate 2 body + accent
          cp $E/gdoor-din.3mf      release/$N-enclosure.3mf
          cp $E/preview.png        release/$N-enclosure-preview.png
          for f in fw/*.bin; do cp "$f" release/$N-$(basename "$f"); done
          ls -l release

      - name: Write release notes
        run: |
          N=gdoor-din-${VERSION}
          cat > notes.md <<EOF
          DIN-rail board (ESP32-S3, Ethernet, audio), see [DESIGN.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/hardware/boards/din/DESIGN.md).

          ## Ordering the board from JLCPCB

          Both options use the same \`$N-gerbers.zip\`; they differ in the BOM and positions file you upload.

          ### Recommended (cheaper): JLC assembly plus a few parts by hand

          Upload \`$N-recommended-bom.csv\` and \`$N-recommended-positions.csv\`, then order the parts in \`$N-hand-soldered.csv\` (quantities per board) from LCSC and solder them yourself. This is the cheaper way to build the board:

          - The board fits JLC's **Economic PCBA**. The ESP32-S3 module (U101) cannot be placed in Economic, so ordering it from JLC forces Standard PCBA, which costs more to set up.
          - Each JLC Extended part costs a \$3 loading fee per part type. The hand-soldered list leaves out six of them (terminals, RJ45 jack, regulator, ESD diode, op-amps, 100 µF caps).
          - The through-hole parts (screw terminals, RJ45 jack, pin header) would otherwise need JLC's through-hole assembly as well.

          Everything on the list takes a soldering iron except the ESP32 module's centre ground pad, which needs hot air or a hot plate. \`$N-ibom.html\` is the interactive assembly view.

          ### Full PCBA: JLC places everything

          Upload \`$N-full-pcba-bom.csv\` and \`$N-full-pcba-positions.csv\` and choose **Standard PCBA**. Only C18 (100 pF 0402, on the bottom side) is still yours to solder, because the assembly is single-sided. Check the rotations in JLC's placement preview, above all U101, U102, U103, J102 and J103.

          ## 3D models

          \`$N-board-step.zip\` (whole board with components), \`$N-enclosure-step.zip\`, and the printable \`$N-enclosure-base.stl\`, \`$N-enclosure-lid.stl\` and \`$N-enclosure-keeper.stl\` (print two: they hold the plugs in the lid).

          To print the enclosure, open \`$N-enclosure.3mf\` in Bambu Studio and slice the plate you want; both hold the base, the lid and the two keepers, already in print orientation. Plate 1 is single colour. Plate 2 is two colours: each part has a \`body\` (filament 1) and an \`accent\` (filament 2). The file comes with Bambu's settings for a P1S with 0.2 mm nozzle and PLA Basic only because Bambu Studio cannot open a two-plate file without them; pick your own printer, process and filaments before slicing.

          ## Firmware (ESPHome)

          Flash \`*.factory.bin\` over USB at offset 0x0 (e.g. with https://web.esphome.io), use \`*.ota.bin\` for updates. The Ethernet image needs no setup. The WiFi image cannot join any network at first, so it opens its fallback hotspot (named after the device); join it and enter your network in the page that opens. The voice build is not included; compile \`esphome/gdoor-din-voice.yaml\` yourself.
          EOF

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/din-')
        uses: softprops/action-gh-release@v2
        with:
          name: "DIN board ${{ env.VERSION }}"
          body_path: notes.md
          files: release/*
          draft: true

      - name: Keep files as an artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/din-') }}
        uses: actions/upload-artifact@v4
        with:
          name: din-release-${{ env.VERSION }}
          path: |
            release/*
            notes.md
